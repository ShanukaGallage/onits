# ─────────────────────────────────────────────────────────────────────────────
#  OnIts — Nginx Production Config
#  Place this at: frontend/nginx.conf
#  Owner: Shanuka (DevOps Lead)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router support — serve index.html for ALL routes.
    # Without this, refreshing /dashboard or navigating directly to /projects/123
    # returns a 404 because Nginx looks for a real file at that path.
    # `try_files` checks: (1) exact file, (2) directory, (3) fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — forward /api requests to the backend container.
    # In production on Azure, this may be replaced by a proper API Gateway or
    # Azure Application Gateway. For single-server deployments this is sufficient.
    location /api {
        proxy_pass http://onits_backend:5000;
        proxy_http_version 1.1;
        # Required for WebSocket (Socket.io) upgrade handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io real-time connections
    location /socket.io {
        proxy_pass http://onits_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
