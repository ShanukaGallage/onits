name: CI/CD — Build & Deploy OnIts to Azure

# ─────────────────────────────────────────────────────────────────────────────
#  OnIts — GitHub Actions CI/CD Pipeline
#  Owner: Shanuka (DevOps Lead)
#
#  WHAT THIS DOES:
#  On every push to main, this workflow runs two parallel jobs:
#  1. Backend: builds a Docker image, pushes it to GitHub Container Registry,
#     then deploys it to Azure Web App for Containers
#  2. Frontend: builds the Vite React SPA and deploys static files to
#     Azure Static Web Apps (free tier, perfect for React SPAs)
#
#  SECRETS REQUIRED (add in GitHub → repo Settings → Secrets and variables → Actions):
#  - AZURE_BACKEND_PUBLISH_PROFILE   : Download from Azure Portal (Backend Web App → Deployment Center → Manage publish profile)
#  - AZURE_STATIC_WEB_APPS_API_TOKEN : Generated automatically when you create the Azure Static Web App and link it to this repo
#
#  NOTE: GITHUB_TOKEN is provided automatically by GitHub Actions — no setup needed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:            # Allows manual trigger from GitHub Actions tab

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/shanukagallage/onits-backend

jobs:

  # ── Job 1: Build + Deploy Backend (Code) ───────────────────────────────────
  deploy-backend:
    name: 🚀 Backend — Build & Deploy Native Code to Azure
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies & Build
        run: |
          npm ci
          npx prisma generate --schema=backend/prisma/schema.prisma
          npm run build --workspace=backend

      - name: 🌐 Deploy to Azure Web App (Code)
        uses: azure/webapps-deploy@v3
        with:
          app-name: onits-backend      # Must match your Azure Web App name exactly
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ./backend

  # ── Job 2: Build + Deploy Frontend ─────────────────────────────────────────
  deploy-frontend:
    name: 🎨 Frontend — Build Vite SPA & Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install frontend dependencies
        run: npm install --prefix frontend

      - name: 🔨 Build React application
        run: npm run build --prefix frontend
        env:
          # This is the production backend URL.
          # Update this to your Azure Web App URL or custom api.onits.app subdomain
          VITE_API_URL: https://onits-backend.azurewebsites.net/api

      - name: 🚀 Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_WATER_02EBE0A00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist # The pre-built static files are here
          output_location: ""         # Ignored when skip_app_build is true
          skip_app_build: true        # We already built above so the env var is set correctly
